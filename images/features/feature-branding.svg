<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b8e23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4a200;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="contentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b8e23;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e4a200;stop-opacity:0.8" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Border -->
  <rect width="600" height="400" fill="#f3f4f6"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Email Template (larger, centered) -->
  <g transform="translate(80, 75)">
    <rect width="400" height="250" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Branded Header -->
    <rect x="0" y="0" width="400" height="80" rx="12" fill="url(#brandGradient)" opacity="0.7"/>
    <rect x="0" y="70" width="400" height="12" rx="0" fill="#ccc"/>

    <!-- Logo -->
    <rect x="20" y="16" width="45" height="45" rx="8" fill="white"/>
    <text x="42" y="49" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-weight="bold" font-size="30">L</text>

    <!-- Brand Text -->
    <text x="80" y="48" fill="white" font-family="Arial, sans-serif" font-weight="600" font-size="28">Your Brand</text>

    <!-- Content Lines -->
    <rect x="25" y="100" width="230" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="120" width="180" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="140" width="210" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="160" width="150" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="180" width="195" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="200" width="170" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
    <rect x="25" y="220" width="140" height="10" rx="5" fill="url(#contentGradient)" opacity="0.5"/>
  </g>

  <!-- Color Palette (left side) -->
  <g transform="translate(520, 120)">
    <circle cx="0" cy="0" r="15" fill="#ff6b6b"/>
    <circle cx="0" cy="40" r="15" fill="#4ecdc4"/>
    <circle cx="0" cy="80" r="15" fill="#45b7d1"/>
    <circle cx="0" cy="120" r="15" fill="#f9ca24"/>
    <circle cx="0" cy="160" r="15" fill="#a55eea"/>
  </g>

</svg>
