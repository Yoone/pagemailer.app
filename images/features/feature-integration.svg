<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f2f5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fafbfc;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="emailGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4285f4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Border -->
  <rect width="600" height="400" fill="#f3f4f6"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Confluence Document (rotated left, larger) -->
  <g transform="translate(90, 80) rotate(-8 80 120)">
    <!-- Main page -->
    <rect x="0" y="0" width="160" height="240" rx="12" fill="url(#pageGrad)" stroke="#e1e5e9" stroke-width="2" filter="url(#dropShadow)"/>

    <!-- Page header -->
    <rect x="1" y="1" width="158" height="48" rx="11" fill="#0052cc"/>
    <rect x="1" y="37" width="158" height="12" fill="#0052cc"/>

    <!-- Confluence logo area -->
    <circle cx="20" cy="24" r="6" fill="#ffffff" opacity="0.9"/>
    <text x="35" y="29" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600">Confluence</text>

    <!-- Document title -->
    <rect x="20" y="68" width="120" height="6" rx="2" fill="#172b4d" opacity="0.9"/>
    <rect x="20" y="80" width="90" height="4" rx="1" fill="#172b4d" opacity="0.7"/>

    <!-- Document content lines -->
    <rect x="20" y="100" width="120" height="4" rx="1" fill="#172b4d" opacity="0.6"/>
    <rect x="20" y="110" width="95" height="4" rx="1" fill="#172b4d" opacity="0.6"/>
    <rect x="20" y="120" width="110" height="4" rx="1" fill="#172b4d" opacity="0.6"/>
    <rect x="20" y="130" width="85" height="4" rx="1" fill="#172b4d" opacity="0.6"/>
    <rect x="20" y="140" width="105" height="4" rx="1" fill="#172b4d" opacity="0.6"/>

    <rect x="20" y="160" width="115" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
    <rect x="20" y="170" width="100" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
    <rect x="20" y="180" width="125" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
    <rect x="20" y="190" width="90" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
    <rect x="20" y="200" width="110" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
    <rect x="20" y="210" width="95" height="4" rx="1" fill="#172b4d" opacity="0.4"/>
  </g>

  <!-- Email Window (rotated right, larger) -->
  <g transform="translate(330, 80) rotate(6 90 140)">
    <!-- Main email -->
    <rect x="0" y="0" width="180" height="240" rx="8" fill="url(#emailGrad)" stroke="#e1e5e9" stroke-width="2" filter="url(#emailGlow)"/>

    <!-- Email header -->
    <rect x="1" y="1" width="178" height="50" rx="7" fill="#ea4335"/>
    <rect x="1" y="42" width="178" height="12" fill="#ea4335"/>

    <!-- Email icon -->
    <g transform="translate(20, 20)" opacity="0.8">
      <rect x="0" y="0" width="20" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M0,3 L10,10 L20,3" stroke="#ffffff" stroke-width="3" fill="none"/>
    </g>

    <!-- Email title -->
    <text x="52" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="600" opacity="0.9">Email</text>

    <!-- Email content header -->
    <rect x="16" y="70" width="148" height="6" rx="2" fill="#ea4335" opacity="0.9"/>
    <rect x="16" y="82" width="110" height="4" rx="1" fill="#5f6368" opacity="0.7"/>

    <!-- Email body content -->
    <rect x="16" y="100" width="140" height="4" rx="1" fill="#5f6368" opacity="0.7"/>
    <rect x="16" y="110" width="125" height="4" rx="1" fill="#5f6368" opacity="0.7"/>
    <rect x="16" y="120" width="135" height="4" rx="1" fill="#5f6368" opacity="0.7"/>
    <rect x="16" y="130" width="105" height="4" rx="1" fill="#5f6368" opacity="0.7"/>
    <rect x="16" y="140" width="130" height="4" rx="1" fill="#5f6368" opacity="0.7"/>

    <rect x="16" y="160" width="120" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
    <rect x="16" y="170" width="145" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
    <rect x="16" y="180" width="115" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
    <rect x="16" y="190" width="135" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
    <rect x="16" y="200" width="100" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
    <rect x="16" y="210" width="115" height="4" rx="1" fill="#5f6368" opacity="0.5"/>
  </g>

  <!-- Flow arrow connecting them -->
  <g transform="translate(273, 180)" opacity="0.7">
    <path d="M0,12 L30,12" stroke="#3b3b3b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M28,0 L38,12 L28,24" stroke="#3b3b3b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
